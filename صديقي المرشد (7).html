<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صديقي المرشد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fb;--card:#fff;--tx:#1d2b3a;--mut:#6b7a8c;--pri:#4f6df5;--pri2:#7c5cf5;--ok:#1fa971;--bad:#e5484d;--mid:#f0a020;--bd:#e3e9f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--card:#182233;--tx:#e8eef7;--mut:#93a3b8;--bd:#263449}}
:root[data-theme="dark"]{--bg:#0f1622;--card:#182233;--tx:#e8eef7;--mut:#93a3b8;--bd:#263449}
:root[data-theme="navy"]{--bg:#0a1a3a;--card:#102650;--tx:#eaf1ff;--mut:#9fb3da;--bd:#1f3b72;--pri:#6f8dff;--pri2:#9a7bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.logo{font-weight:800;font-size:22px;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:12px;padding:4px 9px}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
button{font-family:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(79,109,245,.3)}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.92}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:14px;overflow:hidden}
.bar b{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
h2{font-size:19px;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 10px;text-align:center;color:var(--tx);font-weight:700;font-size:15px;transition:.2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.tile span{display:block;font-size:34px;margin-bottom:4px}.tile small{display:block;color:var(--mut);font-weight:400}
.tile.done{border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-top:14px}
.back{background:none;border:0;color:var(--pri);font-weight:700;font-size:15px;padding:4px 0}
.q{font-size:18px;font-weight:700}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:13px;margin-top:10px;color:var(--tx);font-size:16px;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt em{font-style:normal;background:var(--pri);color:#fff;border-radius:9px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800}
.opt.best{border-color:var(--ok);background:rgba(31,169,113,.12)}.opt.mid{border-color:var(--mid);background:rgba(240,160,32,.12)}.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.1)}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);border-inline-start:5px solid var(--pri)}
.pts{font-weight:800;font-size:20px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:16px;margin-top:14px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row .lb{width:110px;font-size:14px;font-weight:700}
.row .tr{flex:1;height:14px;background:var(--bg);border-radius:9px;overflow:hidden}.row .tr b{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}
.row .n{width:34px;text-align:end;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stats div{background:var(--bg);border-radius:14px;padding:12px;text-align:center}.stats b{display:block;font-size:24px}
.note{color:var(--mut);font-size:13px;margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:13px;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--bd)}footer b{color:var(--tx)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ab{text-align:center}.abl{font-size:60px;animation:bn 2s ease-in-out infinite}.ab1{animation:up .7s both}.ab1:nth-of-type(2){animation-delay:.1s}.ab1:nth-of-type(3){animation-delay:.2s}.ab1:nth-of-type(4){animation-delay:.3s}.ab1:nth-of-type(5){animation-delay:.4s}
.team{display:grid;gap:8px}.team div{display:flex;justify-content:space-between;gap:10px;background:var(--bg);padding:10px 12px;border-radius:12px;font-size:14px}.team span{font-weight:700;text-align:end}
.feat{display:flex;flex-wrap:wrap;gap:8px}.feat span{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb th,table.tb td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:start}table.tb th{color:var(--mut)}
ul.al{margin:8px 0 0;padding-inline-start:20px}ul.al li{margin:5px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:98;font-size:14px}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}details>summary{list-style:none}details[open]>summary{margin-bottom:6px}
.bar2{height:10px;background:var(--bg);border-radius:9px;overflow:hidden}.bar2 b{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .5s}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:16px 0}.chip{height:46px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:800;font-size:16px}.chip.ok{background:rgba(31,169,113,.15);border-color:var(--ok)}.chip.no{background:rgba(229,72,77,.12);border-color:var(--bad)}
.tour{text-align:center}.big{font-size:76px;animation:bn 2s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-12px) scale(1.06)}}.vbar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;margin-bottom:10px}.vbar b{display:block;height:100%;width:0;background:var(--pri)}.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--pri);width:24px;border-radius:9px}
select.pill{color:var(--tx);font-family:inherit}
.in{width:100%;font-family:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:11px 12px;margin-top:4px}.in:focus{outline:none;border-color:var(--pri)}.lbl{display:block;font-weight:700;font-size:14px;margin-top:14px}.opt.sel{border-color:var(--pri);background:rgba(79,109,245,.14)}
.qrc{text-align:center}.qlogo{font-size:40px}.qbox{width:min(300px,82%);margin:0 auto;padding:14px;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(79,109,245,.3);border:6px solid var(--pri)}.qbox svg{display:block;width:100%;height:auto}.qsteps{display:grid;gap:6px;margin:16px 0;font-weight:700;font-size:14px}.qlink{direction:ltr;font-size:12px;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><i>🧭</i> صديقي المرشد</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pill" id="lgb">EN</button><button class="pill" id="thb">🌙</button><button class="pill" id="cbtn" hidden>📊 لوحة المرشد</button><div class="pill" id="pts" hidden>⭐ 0</div><button class="pill" id="out" hidden>🚪 خروج</button></div></header>
<main id="app"></main>
<footer>المرشد: <b>سامي الكايد</b><br>الفكرة: <b>بسام وعلاء الدين</b> · التصميم: <b>علاء الدين</b><br>البرمجة والتطوير: <b>بسام عدنان محمود أبو طبر</b></footer>
</div>
<script>
const T=[
{id:'friends',n:'مواقف مع الأصدقاء',e:'🤝'},{id:'anger',n:'الغضب وحل المشاكل',e:'😤'},
{id:'stress',n:'التوتر والقلق الدراسي',e:'😰'},{id:'comm',n:'التواصل مع الآخرين',e:'💬'},
{id:'bully',n:'التنمر',e:'🛡️'},{id:'study',n:'الدراسة والامتحانات',e:'📝'},
{id:'family',n:'العلاقة مع الأهل',e:'🏠'},{id:'conf',n:'الثقة بالنفس',e:'🌟'},{id:'team',n:'العمل الجماعي',e:'🧩'},{id:'resp',n:'المسؤولية واتخاذ القرار',e:'⚖️'}];
// كل خيار: [النص، النقاط، التوضيح]
const S=[
{id:'f1',t:'friends',q:'صديقك المقرّب يطلب منك أن تغشّه في الاختبار. ماذا تفعل؟',o:[
['أعطيه الإجابة حتى لا يزعل مني',0,'الغش يضرّه ويضرّك، وقد يعرّضكما للعقوبة. الصداقة الحقيقية لا تطلب منك مخالفة القواعد.'],
['أرفض بلطف وأعرض عليه مساعدته في المذاكرة بعد الاختبار',15,'أحسنت! حافظت على صداقتك ومبادئك معًا، وقدّمت له مساعدة حقيقية.'],
['أتجاهله وأتظاهر أني لم أسمعه',5,'تجنّبت المشكلة، لكن الأفضل أن توضّح موقفك بلطف.']]},
{id:'a1',t:'anger',q:'زميلك كسر قلمك المفضل أثناء اللعب وأنت غاضب جدًا. ماذا تفعل؟',o:[
['أصرخ عليه وأكسر أغراضه',0,'الانتقام يزيد المشكلة ويجعلك تخسر الموقف.'],
['أتجاهله وأحتفظ بالغضب في داخلي',5,'كتمان الغضب لا يحلّ المشكلة، وقد ينفجر لاحقًا.'],
['آخذ نفسًا عميقًا، ثم أخبره بهدوء بما شعرت به وأطلب منه الاعتذار',15,'ممتاز! التنفس والتعبير الهادئ عن المشاعر أقوى طريقة لحل الخلافات.']]},
{id:'s1',t:'stress',q:'غدًا اختبار مهم وأنت تشعر بخوف شديد ولا تستطيع التركيز. ماذا تفعل؟',o:[
['أسهر الليل كله أراجع',0,'قلة النوم تُضعف التركيز والذاكرة وتزيد التوتر.'],

['أترك المذاكرة تمامًا وأقول: لن أنجح أبدًا',0,'الأفكار السلبية تزيد الخوف. جرّب خطوات صغيرة بدلًا من الاستسلام.']]},
{id:'c1',t:'comm',q:'تريد الانضمام إلى مجموعة تلعب في الفناء لكنك تشعر بالخجل. ماذا تفعل؟',o:[

{id:'b1',t:'bully',q:'ترى طالبًا يسخر منه مجموعة بسبب شكله، وهو يبكي. ماذا تفعل؟',o:[
['أضحك معهم حتى لا يسخروا مني',0,'المشاركة في التنمر تؤذي الآخرين، والصمت يشجّع المتنمّر.'],

{id:'d1',t:'study',q:'عندك ثلاثة اختبارات خلال أسبوع وتشعر أن الوقت لا يكفي. ماذا تفعل؟',o:[

['أضع جدولًا يوزّع المواد حسب صعوبتها وأبدأ اليوم',15,'ممتاز! التخطيط المبكر والتقسيم يجعل المهمة أسهل بكثير.'],
['أذاكر مادة واحدة فقط وأهمل الباقي',5,'التركيز جيد لكن إهمال المواد سيكلّفك درجات.']]},
{id:'h1',t:'family',q:'والداك يريدان منك الاهتمام بالدراسة أكثر وأنت تشعر أنهما لا يفهمانك. ماذا تفعل؟',o:[

['أختار وقتًا هادئًا وأشرح لهما مشاعري وأسمع وجهة نظرهما',15,'رائع! الحوار الهادئ والاستماع يبنيان التفاهم.'],
['أجادلهما بصوت عالٍ',0,'الصراخ يُغلق باب الحوار، ويصعّب أن يسمعا ما تريد قوله.']]},
{id:'k1',t:'conf',q:'طلب منك المعلم أن تقرأ أمام الفصل وأنت خائف أن تخطئ. ماذا تفعل؟',o:[

['أتدرّب قبلها وأقول لنفسي: الخطأ طبيعي وأستطيع التحسّن',15,'ممتاز! التدرّب والحديث الإيجابي مع النفس يبنيان الثقة.'],
['أقرأ بسرعة وبصوت منخفض لأنتهي',5,'جيد أنك حاولت! جرّب القراءة ببطء وصوت واضح.']]},
{id:'f2',t:'friends',q:'اختلفت مع صديقك وانحاز بعض زملائك ضدك. ماذا تفعل؟',o:[['أنتقم وأحرّض عليه الآخرين',0,'الانتقام يوسّع الخلاف.'],['أكلمه على انفراد بهدوء لنصلح الأمر',15,'ممتاز! الحوار المباشر يحلّ أغلب الخلافات.'],['أقاطعه للأبد',5,'الابتعاد قد يريحك مؤقتًا لكنه لا يحل المشكلة.']]},
{id:'f3',t:'friends',q:'صديق جديد يطلب منك أن تخفي عن أهلك شيئًا يخصه. ماذا تفعل؟',o:[['أسكت دائمًا مهما كان',0,'إن كان الأمر يؤذيه أو يؤذيك فلا تحتفظ به سرًّا.'],['إن كان فيه خطر أخبر شخصًا بالغًا موثوقًا، وإلا أحفظ سره',15,'أحسنت! الأمان أهم من السر.'],['أنشره بين الطلاب',0,'نشر أسرار الآخرين يفقدك الثقة.']]},
{id:'f4',t:'friends',q:'زميلك لا يجد من يلعب معه وهو وحيد. ماذا تفعل؟',o:[['أدعوه للانضمام إلينا',15,'جميل! لطفك قد يغيّر يومه كاملًا.'],['لا شأن لي',0,'مبادرة صغيرة منك تصنع فرقًا كبيرًا.'],['أبتسم له فقط',5,'الابتسامة جيدة، والدعوة أفضل.']]},

{id:'a3',t:'anger',q:'أخذ زميلك مقعدك بالقوة. ماذا تفعل؟',o:[['أدفعه بعيدًا',0,'العنف يعرّضك للعقوبة والأذى.'],['أخبره بأن هذا مقعدي وأطلب منه بهدوء، وإن لم يستجب أخبر المعلم',15,'ممتاز! الحزم الهادئ والاستعانة بالمعلم حل ناضج.'],['أجلس في مكان آخر وأنزعج',5,'تجنّبت المشكلة لكن حقك ضاع.']]},

async function genQ1(secId,n){const sm=await claude.use('sample');if(!sm)throw 0;const t=tn(secId),ex=ALL.filter(s=>s.t===secId).map(s=>s.ar.q).sort(()=>Math.random()-.5).slice(0,6);
const r=await sm.json(`أنشئ ${n} مواقف مدرسية جديدة ومختلفة لقسم «${t.n}» لطلاب المدارس بين 10 و16 سنة في تطبيق إرشاد تربوي. لكل موقف: سؤال قصير وثلاثة خيارات أحدها هو التصرف الأفضل وشرح قصير للتصرف الأفضل. تجنب تكرار هذه الأمثلة: ${JSON.stringify(ex)}. غيّر موضع الإجابة الصحيحة بين الخيارات. أعد JSON فقط على شكل مصفوفة كائنات: {"q":"","o":["","",""],"c":0,"e":"","qe":"","oe":["","",""],"ee":""} حيث c رقم الخيار الصحيح (0 إلى 2) و e شرح قصير، والحقول qe و oe و ee الترجمة الإنجليزية. المحتوى آمن ومناسب للأعمار ولا يتضمن عنفًا أو مواضيع غير لائقة.`,{modelTier:'default'});
return r.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length==3&&x.o.every(o=>typeof o==='string'&&o)&&x.c>=0&&x.c<3&&x.e).map(x=>({...x,t:secId}))}
